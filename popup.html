<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px 16px;
      font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1d2226; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { color: #56687a; font-size: 13px; margin: 0 0 10px; }
    .status { font-weight: 600; margin: 0 0 10px; }
    .ok { color: #1a7f37; } .no { color: #b24020; }
    button { cursor: pointer; background: #0a66c2; color: #fff; border: 0;
      font-weight: 600; padding: 8px 14px; border-radius: 20px; font-size: 13px; width: 100%; }
    button:hover { background: #004182; }
  </style>
</head>
<body>
  <h1>Salary Estimator for LinkedIn</h1>
  <p id="status" class="status"></p>
  <p>Open any profile at linkedin.com/in/… and use the card in the bottom right.</p>
  <button id="opts">Open options</button>
  <script src="popup.js"></script>
</body>
</html>
